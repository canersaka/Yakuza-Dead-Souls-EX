name: Repository hygiene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derived-payload-guard:
    name: Block derived and proprietary payloads
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check tracked files
        run: python tools/check_repository_hygiene.py
